<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>To-do list</h1>
    <form id="todo-form">
      <label for="todo-input">New task</label>
      <div>
        <input id="todo-input" autocomplete="off" required>
        <button>Add</button>
      </div>
    </form>
    <label for="search-input">Search tasks</label>
    <input id="search-input" type="search" placeholder="Search tasks">
    <ul id="todo-list" aria-live="polite"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
